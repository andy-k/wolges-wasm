name: Rust
'on':
  push:
  pull_request:
env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: System Rust version
      run: cargo version
    - uses: dtolnay/rust-toolchain@stable
    - name: Stable Rust version
      run: cargo version
    - name: Format
      run: cargo fmt --check
    - name: Clippy
      run: cargo clippy --release --all-targets --verbose
    - name: Build
      run: cargo build --release --verbose
    - name: Run tests
      run: cargo test --release --verbose
    - name: Build wasm
      run: ./build.sh
