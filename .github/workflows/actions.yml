name: Rust
'on':
  push:
  pull_request:
env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: System Rust version
      run: cargo version
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
    - name: Stable Rust version
      run: cargo version
    - name: Format
      run: cargo fmt --check
    - name: Type-check without the optional feature
      run: cargo check --all-targets --verbose
    - name: Type-check for the target that ships
      run: cargo check --target wasm32-unknown-unknown --verbose
    - name: Clippy
      run: cargo clippy --all-targets --all-features --verbose -- -D warnings
    - name: Run tests with overflow checks
      run: cargo test --all-features --verbose
    - name: Run tests as shipped
      run: cargo test --release --all-features --verbose
    - name: Build wasm
      run: ./build.sh
