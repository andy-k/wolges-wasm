[package]
name = "wolges-wasm"
version = "0.1.0"
authors = ["Andy Kurnia"]
description = "wolges as wasm"
edition = "2024"
license = "MIT"
repository = "https://github.com/andy-k/wolges-wasm"
resolver = "2"

[lib]
crate-type = ["cdylib"]

[dependencies]
console_error_panic_hook = "0.1.7"
getrandom = { version = "0.4.1", features = ["wasm_js"] }
js-sys = "0.3.88"
lazy_static = "1.5.0"
rand = { version = "0.10.0", features = ["chacha"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
wasm-bindgen = "0.2.111"
wasm-bindgen-futures = "0.4.61"
web-sys = { version = "0.3.88", features = ["console"] }
