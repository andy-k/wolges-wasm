[package]
name = "wolges-wasm"
version = "0.1.0"
authors = ["Andy Kurnia"]
description = "wolges as wasm"
edition = "2024"
license = "MIT"
repository = "https://github.com/andy-k/wolges-wasm"
resolver = "2"

[lib]
crate-type = ["cdylib"]

[profile.dev]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"

[dependencies]
console_error_panic_hook = "0.1.7"
js-sys = "0.3.107"
rand = { version = "0.10.3", features = ["chacha"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = { version = "0.3.107", features = ["console"] }
wolges = { path = "wolges" }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]
